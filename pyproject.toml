[project]
name = "mcp-sqlserver"
version = "0.1.0"
description = "MCP SQL SERVER"
readme = "README.md"
authors = [
    { name = "JEFEBI", email = "bcaballero@viva1a.com.co" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.28.1",
    "pyodbc>=5.2.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0"
]

[project.scripts]
mcp-sqlserver = "mcp_sqlserver:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

